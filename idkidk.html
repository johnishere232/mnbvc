<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <style>

    body {
     
    background-color: darkblue;
    color: white;
    font-family: arial, san-serif;
}
     .hero-name {
    font-size: 60px;
    font-weight: bold;
    color: yellow;
    text-shadow: 3px 3px orange;
     }
    .label {
    font-style: italic;
    color: blue;
    text-transform: capitalize;
    }
    .label{
    text-transform:uppercase;
    text-decoration: underline;
    color: coral;
    }

    .power{
    font-weight: bold;
    color: lightgreen;
    }
    
    .weaknessess{
    text-decoration: line-through;
    color: gray;
    }
    
    .badge{
    font-size: 20px;
    font-size: bold;
    color: gold;
    transform: rotate(15deg);
    }


    .made-by{
    color: coral;
    font-style: italic;
        
    }
    </style>
</head>
<body>
   <h1 class="hero name">thunder kid</h1> 
   <p class="tagline"> the most powerful hero</p>

   <h2 class="label">super powers</h2>
   <p class="power">can run as fast as a cheetah</p>
   <p class="power">is as stong as a lion</p>

   <h2 class="label"> weaknessess</h2>
   <p class="weaknessess"> is as young as a 8 year old</p>
   <p class="weaknessess">is as dumb as a 1 year old</p>

   <p class="badge"> top hero</p>
   <p> made by _____</p>
</body>
</html>
